aid: huma-technologies-inc
name: Huma Technologies Inc.
description: >-
  Huma Technologies Inc. operates Huma Finance, described as the first PayFi
  network — on-chain payment-finance infrastructure that connects global capital
  to real-world payment assets such as cross-border settlements, card payments,
  and payroll advances with T+0 on-chain settlement. Huma is offered in two
  forms: Huma (Permissionless), a retail-open protocol launched April 2025, and
  Huma Institutional, a permissioned protocol for licensed financial
  institutions accessing curated payment-financing and RWA opportunities. The
  protocol runs as smart contracts across Solana, EVM chains, and Stellar
  (Soroban), has processed over $7 billion in on-chain transactions, and is
  backed by partners including Solana, Circle, the Stellar Development
  Foundation, and Galaxy Digital. Developers integrate through the first-party
  @huma-finance JavaScript SDK, Solana permissionless SDK, Soroban SDK, and
  embeddable React widgets published on npm.
