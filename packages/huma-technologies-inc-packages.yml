notes: >-
  First-party Huma Finance client libraries published to npm under the
  @huma-finance scope from the github.com/00labs source org (huma-js and
  huma-soroban-sdk monorepos). These are JavaScript/TypeScript SDKs and
  embeddable widgets for integrating with the Huma PayFi protocol across
  Solana, EVM, and Stellar (Soroban). Huma is a smart-contract protocol, not
  a REST API, so there is no server-side multi-language SDK matrix.
